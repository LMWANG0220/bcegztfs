<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>桩头防水工艺样板轻量化模型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#14181c; color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior:none;
  }
  body { display:flex; flex-direction:column; }

  header {
    flex:0 0 auto; text-align:center;
    padding:calc(env(safe-area-inset-top) + 18px) 16px 12px;
  }
  header .n { font-size:21px; font-weight:600; letter-spacing:.5px; }
  header .s { font-size:13px; color:#9aa5b1; margin-top:6px; }

  .carousel { flex:1 1 auto; position:relative; overflow:hidden; }

  /* 左右圆形切换按钮（电脑端显示，手机端隐藏，手机上直接滑） */
  .arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.14); color:#fff; font-size:28px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    box-shadow:0 2px 10px rgba(0,0,0,.3); transition:.2s;
  }
  .arrow:hover { background:rgba(255,255,255,.28); }
  .arrow:active { transform:translateY(-50%) scale(.92); }
  .arrow.prev { left:16px; }
  .arrow.next { right:16px; }
  .arrow.off { opacity:.25; pointer-events:none; }
  @media (max-width:820px) { .arrow { display:none; } }
  @media (hover:none) { .arrow { display:none; } }
  .track {
    display:flex; height:100%; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .track::-webkit-scrollbar { display:none; }
  .slide {
    flex:0 0 100%; height:100%; scroll-snap-align:center;
    display:flex; align-items:center; justify-content:center; padding:0 10px;
  }
  .slide img.pic {
    max-width:100%; max-height:100%; object-fit:contain;
    border-radius:8px; display:block; background:#1c2126;
  }

  /* 最后一屏：二维码卡 */
  .qr-card {
    width:min(84vw, 360px); background:#fff; border-radius:16px;
    padding:22px 20px 18px; text-align:center; color:#1b1f23;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .qr-card .qt { font-size:17px; font-weight:600; margin-bottom:14px; line-height:1.4; }
  .qr-card .qbox { display:flex; justify-content:center; }
  .qr-card .qbox canvas, .qr-card .qbox img {
    width:250px !important; height:250px !important; display:block;
    border-radius:8px; background:#fff;
  }
  .qr-card .qp { font-size:13px; color:#6b7480; margin-top:12px; line-height:1.6; }
  .qr-card .qb {
    display:block; margin-top:14px; padding:12px 0; border-radius:10px;
    background:#0b6bff; color:#fff; font-size:16px; font-weight:600; text-decoration:none;
  }

  .bar {
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:14px 0 calc(env(safe-area-inset-bottom) + 20px);
  }
  .dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); transition:.25s; }
  .dot.on { width:18px; border-radius:4px; background:#fff; }
  .dot.qr { border-radius:2px; }
  .dot.qr.on { background:#4da3ff; }
  .count {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 46px);
    font-size:12px; color:rgba(255,255,255,.75);
    background:rgba(0,0,0,.4); padding:3px 11px; border-radius:20px;
  }

  .viewer {
    position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:99;
    display:none; align-items:center; justify-content:center;
    touch-action:none; overflow:hidden;
  }
  .viewer.on { display:flex; }
  .viewer .vstage {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:none;
  }
  .viewer img#vimg {
    max-width:100%; max-height:100%; object-fit:contain;
    transform-origin:center center; will-change:transform;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .viewer .close {
    position:absolute; top:calc(env(safe-area-inset-top) + 14px); right:16px;
    width:38px; height:38px; line-height:36px; text-align:center; z-index:5;
    border-radius:50%; background:rgba(255,255,255,.18); font-size:20px;
  }
  .viewer .hint {
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 18px);
    color:#9aa5b1; font-size:13px; text-align:center; z-index:5;
    background:rgba(0,0,0,.45); padding:7px 0; pointer-events:none;
  }
  .viewer .zoombar {
    position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom) + 62px);
    z-index:5; display:flex; flex-direction:column; gap:10px;
  }
  .viewer .zoombar b {
    width:42px; height:42px; line-height:40px; text-align:center; font-size:22px;
    border-radius:50%; background:rgba(255,255,255,.18); color:#fff;
    display:block; cursor:pointer; -webkit-user-select:none; user-select:none;
  }

  /* 轮播图上提示可点击放大 */
  .slide { position:relative; }
  .slide .zoomtag {
    position:absolute; right:14px; bottom:14px; z-index:3;
    background:rgba(0,0,0,.45); color:#fff; font-size:11px;
    padding:4px 9px; border-radius:20px; pointer-events:none;
    display:flex; align-items:center; gap:4px;
  }
</style>
</head>
<body>

<header id="hd"></header>

<div class="carousel">
  <div class="track" id="track"></div>
  <button class="arrow prev" id="prev" aria-label="上一张">‹</button>
  <button class="arrow next" id="next" aria-label="下一张">›</button>
  <div class="count" id="count"></div>
</div>

<div class="bar" id="bar"></div>

<div class="viewer" id="viewer">
  <span class="close" id="vclose">✕</span>
  <div class="vstage" id="vstage"><img id="vimg" src="" alt=""></div>
  <div class="zoombar">
    <b id="zin">＋</b>
    <b id="zout">－</b>
    <b id="zreset">⤾</b>
  </div>
  <div class="hint" id="vhint">双指放大 · 双击放大 · 拖动查看 · 点空白处关闭</div>
</div>

<script>
(function () {
  var V    = window.VERSION || '1';
  var NAME = window.TITLE || '工艺样板';
  var SUB  = window.SUBTITLE || '';
  var IMGS = window.IMAGES || [];
  var LINK = window.LINK || '';

  function v(src) { return src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + V; }

  document.title = NAME;
  document.getElementById('hd').innerHTML =
      '<div class="n">' + NAME + '</div>'
    + (SUB ? '<div class="s">' + SUB + '</div>' : '');

  var track = document.getElementById('track');
  var bar   = document.getElementById('bar');
  var count = document.getElementById('count');
  var index = 0;

  var urls = IMGS.map(v);
  var CARD_N = (window.CARDS && window.CARDS.length) ? window.CARDS.length : 1;
  var total = urls.length + CARD_N;   // 效果图 + 卡片页

  /* ---- 前面三张效果图 ---- */
  IMGS.forEach(function (src, i) {
    var s = document.createElement('div'); s.className = 'slide';
    var im = document.createElement('img');
    im.className = 'pic'; im.src = urls[i]; im.alt = NAME + ' ' + (i + 1);
    im.draggable = false;
    im.onclick = function () { openViewer(urls[i]); };
    s.appendChild(im);
    var tag = document.createElement('span');
    tag.className = 'zoomtag'; tag.textContent = '🔍 点击放大';
    s.appendChild(tag);
    track.appendChild(s);
    bar.appendChild(document.createElement('span')).className = 'dot';
  });

  /* ---- 后面的卡片页（二维码页）：CARDS 配几段就出几页 ---- */
  var CARDS = (window.CARDS && window.CARDS.length)
    ? window.CARDS
    : [{ title: window.QR_TITLE, link: window.LINK, tip: window.QR_TIP, btn: window.BTN_TEXT }];

  CARDS.forEach(function (c, ci) {
    var qs = document.createElement('div'); qs.className = 'slide';
    var card = document.createElement('div'); card.className = 'qr-card';

    var qt = document.createElement('div'); qt.className = 'qt';
    qt.textContent = c.title || '扫码查看更多资料';
    card.appendChild(qt);

    var box = document.createElement('div'); box.className = 'qbox';
    card.appendChild(box);

    if (c.qr) {
      // 用现成的二维码截图
      var qi = document.createElement('img');
      qi.src = v(c.qr); qi.alt = '二维码';
      box.appendChild(qi);
    } else if (c.link) {
      // 把网址自动画成二维码
      new QRCode(box, {
        text: c.link, width: 250, height: 250,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    var qp = document.createElement('div'); qp.className = 'qp';
    qp.textContent = c.tip || '长按识别二维码';
    card.appendChild(qp);

    if (c.link && c.btn !== '') {
      var qb = document.createElement('a');
      qb.className = 'qb'; qb.href = c.link; qb.target = '_blank';
      qb.textContent = c.btn || '直接打开';
      card.appendChild(qb);
    }

    qs.appendChild(card); track.appendChild(qs);
    bar.appendChild(document.createElement('span')).className = 'dot qr';
  });

  var dots = bar.querySelectorAll('.dot');
  function setActive(i) {
    index = i;
    for (var k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i);
    count.textContent = (i + 1) + ' / ' + total;
    preload(i + 1); preload(i - 1);
  }
  function preload(i) { if (i >= 0 && i < urls.length) { var im = new Image(); im.src = urls[i]; } }
  setActive(0);

  var tick;
  track.addEventListener('scroll', function () {
    clearTimeout(tick);
    tick = setTimeout(function () {
      var w = track.clientWidth;
      if (w) setActive(Math.round(track.scrollLeft / w));
      syncArrow();
    }, 60);
  });

  /* ---- 电脑端：左右圆形按钮 + 键盘方向键 ---- */
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');

  function go(i) {
    i = Math.max(0, Math.min(total - 1, i));
    track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
    setActive(i);
    syncArrow();
  }
  function syncArrow() {
    prevBtn.classList.toggle('off', index <= 0);
    nextBtn.classList.toggle('off', index >= total - 1);
  }
  prevBtn.onclick = function () { go(index - 1); };
  nextBtn.onclick = function () { go(index + 1); };
  document.addEventListener('keydown', function (e) {
    var vw = document.getElementById('viewer');
    if (vw && vw.classList.contains('on')) return;   // 看大图时不响应
    if (e.key === 'ArrowLeft')  go(index - 1);
    if (e.key === 'ArrowRight') go(index + 1);
  });
  syncArrow();

  /* ============================================
     全屏看大图：支持双指捏合 / 双击 / 按钮 放大
     ============================================ */
  var viewer = document.getElementById('viewer');
  var stage  = document.getElementById('vstage');
  var vimg   = document.getElementById('vimg');
  var vhint  = document.getElementById('vhint');

  var scale = 1, minS = 1, maxS = 6;
  var tx = 0, ty = 0;

  function apply() {
    // 限制拖动范围，避免拖出屏幕外找不回来
    var r = vimg.getBoundingClientRect();
    var maxX = Math.max(0, (vimg.offsetWidth * scale - stage.clientWidth) / 2);
    var maxY = Math.max(0, (vimg.offsetHeight * scale - stage.clientHeight) / 2);
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
    vimg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    vhint.textContent = scale > 1.01
      ? '已放大 ' + scale.toFixed(1) + ' 倍 · 拖动查看 · 点右下角 ↺ 复位'
      : '双指放大 · 双击放大 · 点空白处关闭';
  }
  function reset() { scale = 1; tx = 0; ty = 0; apply(); }

  function openViewer(src) {
    vimg.src = src;
    viewer.classList.add('on');
    if (document.body.style.overflow !== 'hidden') {
      viewer._prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
    }
    reset();
  }
  function closeViewer() {
    viewer.classList.remove('on');
    document.body.style.overflow = viewer._prevOverflow || '';
    reset();
  }

  /* ---- 手指：双指捏合 + 单指拖动 + 双击 ---- */
  var start = null, lastTap = 0, moved = false;

  function dist(a, b) {
    var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function mid(a, b) {
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  }

  stage.addEventListener('touchstart', function (e) {
    moved = false;
    if (e.touches.length === 2) {
      start = {
        d: dist(e.touches[0], e.touches[1]),
        s: scale,
        m: mid(e.touches[0], e.touches[1])
      };
    } else if (e.touches.length === 1) {
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty, s: scale };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (!start) return;
    e.preventDefault();
    moved = true;

    if (e.touches.length === 2 && start.d) {
      var nd = dist(e.touches[0], e.touches[1]);
      scale = Math.max(minS, Math.min(maxS, start.s * (nd / start.d)));
      // 双指中心移动时同步平移
      var nm = mid(e.touches[0], e.touches[1]);
      tx = start.tx2 === undefined ? tx : tx + (nm.x - start.m.x);
      ty = start.ty2 === undefined ? ty : ty + (nm.y - start.m.y);
      start.tx2 = tx; start.ty2 = ty; start.m = nm;
      apply();
    } else if (e.touches.length === 1 && start.x !== undefined) {
      // 放大后才能拖动；没放大时横向滑动用来切图
      if (scale > 1.01) {
        tx = start.tx + (e.touches[0].clientX - start.x);
        ty = start.ty + (e.touches[0].clientY - start.y);
        apply();
      }
    }
  }, { passive: false });

  stage.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) {
      // 双击放大
      var now = Date.now();
      if (!moved && now - lastTap < 300) {
        if (scale > 1.01) reset();
        else { scale = 2.5; apply(); }
        lastTap = 0;
      } else if (!moved) {
        lastTap = now;
      }
      start = null;
    } else if (e.touches.length === 1) {
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty, s: scale };
    }
  }, { passive: true });

  /* ---- 鼠标：滚轮缩放 + 拖动 ---- */
  var dragging = false, mx = 0, my = 0;
  stage.addEventListener('mousedown', function (e) {
    if (scale > 1.01) { dragging = true; mx = e.clientX; my = e.clientY; }
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    tx += e.clientX - mx; ty += e.clientY - my;
    mx = e.clientX; my = e.clientY; apply();
  });
  window.addEventListener('mouseup', function () { dragging = false; });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    scale = Math.max(minS, Math.min(maxS, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    apply();
  }, { passive: false });

  /* ---- 右下角按钮 ---- */
  document.getElementById('zin').onclick = function (e) {
    e.stopPropagation();
    scale = Math.min(maxS, scale * 1.5); apply();
  };
  document.getElementById('zout').onclick = function (e) {
    e.stopPropagation();
    scale = Math.max(minS, scale / 1.5);
    if (scale <= 1.01) reset(); else apply();
  };
  document.getElementById('zreset').onclick = function (e) {
    e.stopPropagation(); reset();
  };
  document.getElementById('vclose').onclick = function (e) {
    e.stopPropagation(); closeViewer();
  };

  /* 点空白处关闭（放大状态下不关，避免误触） */
  viewer.addEventListener('click', function (e) {
    if (e.target === vimg) return;
    if (scale > 1.01) { reset(); return; }
    closeViewer();
  });

  window.addEventListener('resize', function () { if (viewer.classList.contains('on')) apply(); });
})();
</script>
</body>
</html>
